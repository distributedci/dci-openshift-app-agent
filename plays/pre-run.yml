---

- name: Pre-run
  dci_job:
    id: "{{ job_id }}"
    status: "pre-run"
  delegate_to: localhost
  tags: [dci]

- name: Install packages to check workload compatibility with OCP versions
  ansible.builtin.dnf:
    name:
      - python3-semver
      - python3-junit_xml
    state: present
  become: true
  when: check_workload_api | default(true) | bool

- name: Include installed software and git repos as components
  vars:
    mandatory_rpms:
      - ansible
      - ansible-collection-redhatci-ocp
      - dci-ansible
      - dci-openshift-app-agent
      - dci-pipeline
      - podman
      - python3-dciclient
      - python3-kubernetes
      - python3-openshift
    ic_rpms: "{{ (dci_rpms_to_components + mandatory_rpms) | flatten }}"
    ic_gits: "{{ dci_gits_to_components | flatten }}"
    ic_dev_gits: "{{ dev_gits_to_components | flatten }}"
  ansible.builtin.include_role:
    name: redhatci.ocp.include_components
    apply:
      delegate_to: localhost

- name: Get the updated job_info
  dci_job:
    id: "{{ job_id }}"
  delegate_to: localhost
  register: dci_app_agent_job_info

- name: Compute if all needed components are ga
  vars:
    ga_components: "{{ dci_app_agent_job_info.job.components | selectattr('tags', 'issuperset', ['build:ga']) | map(attribute='type') | list }}"
  ansible.builtin.set_fact:
    dci_all_components_are_ga: "{{ dci_ga_components_for_certification | difference(ga_components) | length == 0 }}"

- name: Debug components for the certification
  vars:
    ga_components: "{{ dci_app_agent_job_info.job.components | selectattr('tags', 'issuperset', ['build:ga']) | map(attribute='type') | list }}"
  ansible.builtin.debug:
    msg:
      - "dci_ga_components_for_certification: {{ dci_ga_components_for_certification }}"
      - "job_info_job_components: {{ dci_app_agent_job_info.job.components }}"
      - "ga_components: {{ ga_components }}"
      - "dci_all_components_are_ga: {{ dci_all_components_are_ga }}"

- name: Resolve BMC data for node_info from inventory (best-effort)
  vars:
    _ni_bmc_hosts: "{{ groups['all'] | select('in', hostvars) | list }}"
  when:
    - dci_collect_hardware | default(true) | bool
  block:
    - name: Build BMC address map for node_info
      ansible.builtin.set_fact:
        _ni_bmc_address: >-
          {{
            _ni_bmc_address | default({}) | combine({
              (hostvars[item].name | default(hostvars[item].nodename) | default(hostvars[item].hostname) | default(item)):
                (hostvars[item].bmc_address | default(hostvars[item].ipmi_address))
            })
          }}
      loop: "{{ _ni_bmc_hosts }}"
      loop_control:
        label: "{{ item }}"
      when:
        - "'bmc_address' in hostvars[item] or 'ipmi_address' in hostvars[item]"

    - name: Determine BMC credentials for node_info
      ansible.builtin.set_fact:
        _ni_bmc_username: "{{ hostvars[item].bmc_user | default(hostvars[item].ipmi_user) | default('') }}"
        _ni_bmc_password: "{{ hostvars[item].bmc_password | default(hostvars[item].ipmi_password) | default('') }}"
      loop: "{{ _ni_bmc_hosts }}"
      loop_control:
        label: "{{ item }}"
      when:
        - _ni_bmc_username is not defined
        - "'bmc_user' in hostvars[item] or 'ipmi_user' in hostvars[item]"
      no_log: true

    - name: Ensure BMC credentials are resolvable
      ansible.builtin.set_fact:
        _ni_bmc_username: "{{ _ni_bmc_username | default('') | string }}"
        _ni_bmc_password: "{{ _ni_bmc_password | default('') | string }}"
      no_log: true
  rescue:
    - name: Disable inventory BMC data when it cannot be resolved
      ansible.builtin.set_fact:
        _ni_bmc_address: {}
        _ni_bmc_username: ""
        _ni_bmc_password: ""

    - name: Notify that inventory BMC data was skipped
      ansible.builtin.debug:
        msg: >-
          Skipping inventory BMC data: BMC address or credentials could not be
          resolved from the inventory

- name: Gather node hardware and kernel information
  ansible.builtin.include_role:
    name: redhatci.ocp.node_info
  vars:
    ni_oc_tool_path: "{{ oc_tool_path }}"
    ni_job_logs_path: "{{ job_logs.path }}"
    ni_disconnected: "{{ dci_disconnected | default(false) }}"
    ni_local_registry: "{{ dci_local_registry }}"
    ni_local_img_path: "{{ dci_hardware_img_path | default('/dci/lshw') }}"
    ni_pullsecret_file: "{{ pullsecret_tmp_file | default('') }}"
    ni_tag: "{{ dci_hardware_tag | default('latest') }}"
    # BMC firmware and BIOS settings (best-effort): BMC addresses and
    # credentials come from the inventory (resolved above) and from the
    # BareMetalHosts, on the hub for ACM/ZTP managed clusters (namespace named
    # after the cluster) or on the cluster itself otherwise (IPI/ABI); the
    # BareMetalHost data wins for a given node. Nothing is collected when no
    # BMC is found.
    ni_collect_bmc: true
    ni_collect_bios_settings: "{{ dci_collect_bios_settings | default(true) | bool }}"
    ni_bmc_address: "{{ _ni_bmc_address | default({}) }}"
    ni_bmc_username: "{{ _ni_bmc_username | default('') }}"
    ni_bmc_password: "{{ _ni_bmc_password | default('') }}"
    ni_bmc_from_bmh: true
    ni_hub_kubeconfig: "{{ hub_kubeconfig_path | default('') }}"
    ni_hub_kubeconfig_namespace: >-
      {{ cluster_name if (hub_kubeconfig_path is defined and cluster_name is defined)
         else 'openshift-machine-api' }}
    # Lab BMCs typically use self-signed certificates (default: do not validate).
    ni_bmc_validate_certs: "{{ not (disable_bmc_certificate_verification | default(true) | bool) }}"
  when:
    - dci_collect_hardware | default(true) | bool

- name: Empty Console log files if present
  ansible.builtin.command: dd if=/dev/null of="{{ item }}"
  with_fileglob:
    - "/var/consoles/{{ cluster_name }}/{{ cluster_name }}*"
  when:
    - cluster_name is defined
  become: true
