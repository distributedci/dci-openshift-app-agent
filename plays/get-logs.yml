---
# kbpc_test_config is defined in certsuite and it may contain dci_openshift_app_ns
# If no kbpc_test_config is provided externally, ns_list will not be generated here
- name: Obtain namespaces from kbpc_test_config variable if exists (excepting dci_openshift_app_ns if provided)
  ansible.builtin.set_fact:
    ns_list: "{{ ns_list | default([]) + [ item.namespace ] }}"
  when:
    - kbpc_test_config | default('') | length
    - item.namespace | default('') | length
    - item.namespace != dci_openshift_app_ns
  loop: "{{ kbpc_test_config }}"

# This appends dci_openshift_app_ns to ns_list (which is empty if kbpc_test_config is not
# provided externally)
- name: Append dci_openshift_app_ns to the list
  ansible.builtin.set_fact:
    ns_list: "{{ ns_list | default([]) + [ dci_openshift_app_ns ] }}"

- name: Get OCP logs from namespace
  ansible.builtin.include_role:
    name: redhatci.ocp.get_logs_from_namespace
  vars:
    glfn_dir: "{{ job_logs.path }}"
    glfn_oc: "{{ oc_tool_path }}"
  loop: "{{ ns_list }}"
  loop_control:
    loop_var: glfn_ns

- name: Resolve and mirror must-gather images
  vars:
    _mg_is_type: "{{ (ocp_version | default(version)) is version('4.14', '>') | ternary('idms', 'icsp') }}"
    _mg_hints: "{{ dci_must_gather_images | default([]) | reject('search', '/') | list }}"
    _mg_full: "{{ dci_must_gather_images | default([]) | select('search', '/') | list }}"
  block:
    - name: Reset resolved must-gather images
      ansible.builtin.set_fact:
        rmgi_resolved_images: []

    - name: Resolve must-gather hints to full image references
      ansible.builtin.include_role:
        name: redhatci.ocp.resolve_must_gather_images
      vars:
        rmgi_images: "{{ _mg_hints }}"
      when:
        - _mg_hints | length > 0

    - name: Set must-gather images
      ansible.builtin.set_fact:
        mi_mg_images: "{{ (_mg_full + rmgi_resolved_images) | flatten | unique | list }}"

    # Best effort to mirror explicit full must-gather refs. Hints
    # are resolved from CSVs and are expected to be reachable already.
    - name: Clear Image Source file fact
      ansible.builtin.set_fact:
        mi_is_file: {}

    - name: Mirror must-gather images
      ansible.builtin.include_role:
        name: redhatci.ocp.mirror_images
      vars:
        mi_images: "{{ _mg_full }}"
        mi_authfile: "{{ pullsecret_tmp_file }}"
        mi_registry: "{{ dci_local_registry }}"
        mi_is_type: "{{ _mg_is_type }}"
        mi_is_name: "must-gather"
      when:
        - dci_disconnected | default(false) | bool
        - dci_local_registry | length
        - do_must_gather | bool
        - _mg_full | length > 0

    - name: Apply Image Source manifest
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.file', mi_is_file.path) | from_yaml_all | list }}"
      register: _mg_is_apply
      failed_when: false
      when:
        - mi_is_file is defined
        - mi_is_file.path is defined

    - name: Wait for IDMS to roll out
      ansible.builtin.include_role:
        name: redhatci.ocp.check_resource
        apply:
          ignore_errors: true
      vars:
        resource_to_check: "MachineConfigPool"
        check_wait_retries: 120
        check_wait_delay: 10
      when:
        - _mg_is_apply is changed  # noqa: no-handler

    - name: Remove temporary Image Source file
      ansible.builtin.file:
        path: "{{ mi_is_file.path }}"
        state: absent
      when:
        - mi_is_file is defined
        - mi_is_file.path is defined

    - name: Clear Image Source file fact
      ansible.builtin.set_fact:
        mi_is_file: {}

- name: Get logs from OCP deployment
  environment:
    DCI_MUST_GATHER_IMAGES: '{{ mi_mg_images | default([]) | join(" ") }}'
    SINCE_TIME: "{{ job_info.job.created_at }}"
    PATH: "{{ ansible_env.PATH }}:/sbin:/usr/sbin:/usr/local/bin/{% if client_tmp_dir.path is defined %}:{{ client_tmp_dir.path }}{% endif %}"
    DO_MUST_GATHER: "{{ do_must_gather | lower }}"
  ansible.builtin.shell:
    cmd: >
      timeout -v 20m
      plays/scripts/get-logs "{{ job_logs.path }}"
  delegate_to: localhost
  ignore_errors: true

- name: "Remove the must-gather directory"
  ansible.builtin.file:
    path: "{{ job_logs.path }}/must_gather"
    state: absent
...
